          type: integer
        tenantId:
          type: integer
        phrase:
          type: string
        searchVolume:
          type: ["integer", "null"]
        cpc:
          type: ["number", "null"]
        kd:
          type: ["integer", "null"]
        intent:
          type: ["string", "null"]
        clusterId:
          type: ["integer", "null"]
        source:
          type: string
          enum: [manual, csv, ahrefs, semrush]
        isActive:
          type: boolean
        rawScore:
          type: ["number", "null"]
        finalScore:
          type: ["number", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
