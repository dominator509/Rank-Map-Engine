components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    RegisterBody:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        fullName:
          type: string
        tenantName:
          type: string
      required:
        - email
        - password
        - fullName
        - tenantName

    LoginBody:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        tenant:
          $ref: "#/components/schemas/Tenant"
      required:
        - user
        - tenant

    User:
      type: object
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        email:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum: [super_admin, agency_admin, agency_user, client]
        avatarUrl:
          type: ["string", "null"]
        lastLoginAt:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - tenantId
        - email
        - fullName
        - role
        - createdAt
        - updatedAt

    Tenant:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        plan:
          type: string
          enum: [solo, agency, enterprise]
        seatsUsed:
          type: integer
        seatsMax:
          type: integer
        whiteLabelConfig:
          type: ["object", "null"]
        stripeCustomerId:
          type: ["string", "null"]
        stripeSubscriptionId:
          type: ["string", "null"]
        stripeSubscriptionStatus:
          type: ["string", "null"]
        stripeCurrentPeriodEnd:
          type: ["string", "null"]
        stripeCancelAtPeriodEnd:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - plan
        - seatsUsed
        - seatsMax
        - stripeCancelAtPeriodEnd
        - createdAt
        - updatedAt

    UpdateTenantBody:
      type: object
      properties:
        name:
          type: string
        whiteLabelConfig:
          type: object

    DashboardSummary:
      type: object
      properties:
        clientCount:
          type: integer
        projectCount:
          type: integer
        keywordCount:
          type: integer
        clusterCount:
          type: integer
        briefCount:
          type: integer
        pendingApprovals:
          type: integer
        aiTasksThisMonth:
          type: integer
      required:
        - clientCount
        - projectCount
        - keywordCount
        - clusterCount
        - briefCount
        - pendingApprovals
        - aiTasksThisMonth

    Client:
      type: object
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        name:
          type: string
        domain:
          type: ["string", "null"]
        industry:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - tenantId
        - name
        - isActive
        - createdAt
        - updatedAt

    CreateClientBody:
      type: object
      properties:
        name:
          type: string
        domain:
          type: string
        industry:
          type: string
      required:
        - name

    UpdateClientBody:
      type: object
      properties:
        name:
          type: string
        domain:
          type: string
        industry:
          type: string
        logoUrl:
          type: string
        isActive:
          type: boolean

