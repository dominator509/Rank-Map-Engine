      properties:
        id:
          type: integer
        clientId:
          type: integer
        tenantId:
          type: integer
        name:
          type: string
        targetDomain:
          type: ["string", "null"]
        locale:
          type: string
        status:
          type: string
          enum: [active, paused, archived]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - clientId
        - tenantId
        - name
        - locale
        - status
        - createdAt
        - updatedAt

    CreateProjectBody:
      type: object
